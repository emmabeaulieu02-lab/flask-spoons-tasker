<!DOCTYPE html>
<html lang="en" data-theme="{{ display.theme }}" data-font="{{ display.font_size }}"{% if not display.show_energy_words %} class="hide-energy-words"{% endif %}>
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="{{ url_for("static", filename="style.css") }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for("static", filename="favicon.ico") }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="login-page">
<main class="task-details-form">
    <h1>Energy Calendar</h1>
    <form autocomplete="off" method="POST" action="{{ base_url }}/do_login">
        <label for="username">Username</label>
        <input type="text" autocomplete="off" placeholder="Username" value="" id="username"
            name="username" minlength="2" required />
        <br/>

        <label for="password">Password</label>
        <input type="password" autocomplete="off" placeholder="Password" value="" id="password"
            name="password" minlength="8" required />
        <br/>

        <input class="form-button form-button-primary" type="submit" value="Login" />
    </form>
</main>

</body>
</html>
